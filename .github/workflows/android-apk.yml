# Gera o APK Android do Listenimento.
#
# Como usar:
#   • Manual: aba Actions → "Android APK" → Run workflow. O APK fica em "Artifacts".
#   • Tag:    git tag v0.2.0 && git push origin v0.2.0 → o APK também é anexado à Release.
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY   → obrigatórios para o app conectar
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD                   → opcionais (assinatura própria)
# Sem keystore próprio, o APK sai assinado com a chave de debug (serve para testes).

name: Android APK

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'ABIs (arm64-v8a cobre quase todos os celulares atuais)'
        required: false
        default: 'arm64-v8a,armeabi-v7a'
  push:
    tags: ['v*']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # necessário só para anexar o APK em releases de tags

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ARCHS: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
      CI: 'true'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Conferir secrets do Supabase
        if: env.EXPO_PUBLIC_SUPABASE_URL == '' || env.EXPO_PUBLIC_SUPABASE_ANON_KEY == ''
        run: echo "::warning::EXPO_PUBLIC_SUPABASE_URL/ANON_KEY não configurados — o APK será gerado, mas não vai conectar ao Supabase."

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME) com as
      # licenças aceitas; o Gradle baixa sozinho o que faltar (platform/build-tools).
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Versão $APP_VERSION (versionCode $ANDROID_VERSION_CODE)"

      - name: Gerar projeto Android (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Mais memória para o Gradle
        working-directory: apps/mobile/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties

      - name: Compilar APK (release)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ARCHS"

      - name: Assinar com keystore próprio
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Preparar arquivo
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/listenimento-${APP_VERSION}-${ANDROID_VERSION_CODE}.apk"
          ls -lh dist

      - name: Enviar como artifact
        uses: actions/upload-artifact@v7
        with:
          name: listenimento-apk-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Anexar à Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
